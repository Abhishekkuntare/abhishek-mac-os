name: Build and Release ARLO OS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write

jobs:
  build-macos:
    name: Build macOS Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS universal installer
        run: npm run package:mac
        env:
          VITE_ANALYTICS_API_ORIGIN: https://arlo-os.onrender.com

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arlo-os-macos-release-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 90

  release:
    name: Build Windows Release
    runs-on: windows-latest
    needs: build-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voice-requirements.txt

      - name: Install voice build dependencies
        run: python -m pip install -r voice-requirements.txt

      - name: Show environment
        run: |
          node --version
          npm --version
          python --version
          git --version

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer
        env:
          VITE_ANALYTICS_API_ORIGIN: https://arlo-os.onrender.com

      - name: Build Windows installer
        run: npm run package:exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: arlo-os-macos-release-${{ github.ref_name }}
          path: release

      - name: Check Microsoft Store package identity
        id: store-identity
        shell: pwsh
        env:
          APPX_IDENTITY_NAME: ${{ vars.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $required = @(
            "APPX_IDENTITY_NAME",
            "APPX_PUBLISHER",
            "APPX_PUBLISHER_DISPLAY_NAME"
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::Microsoft Store package identity is not configured. The unsigned GitHub EXE will still be released, but the MSIX build is skipped. After reserving the app name in Partner Center, add these repository variables: $($missing -join ', ')."
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build Microsoft Store package
        if: steps.store-identity.outputs.configured == 'true'
        run: npm run package:store
        env:
          APPX_IDENTITY_NAME: ${{ vars.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ vars.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.APPX_PUBLISHER_DISPLAY_NAME }}

      - name: List release files
        shell: pwsh
        run: |
          Write-Host "========== RELEASE DIRECTORY =========="
          Get-ChildItem -Path release -Recurse |
            Select-Object FullName, Length

      - name: Upload unsigned Microsoft Store submission package
        if: steps.store-identity.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arlo-os-store-package-${{ github.ref_name }}
          path: release/*.appx
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ARLO OS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/ARLO-OS-Setup.exe
            release/latest.yml
            release/ARLO-OS-*-mac-universal.dmg
            release/ARLO-OS-*-mac-universal.zip
            release/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
