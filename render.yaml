services:
  - type: web
    name: abhishek-os-mobile-mirror
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:mirror
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
